<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pagos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-primary">Pagos Registrados</h2>
        <table class="table table-striped shadow-sm">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Habitante</th>
                    <th>Periodo</th>
                    <th>Monto Pagado</th>
                    <th>Fecha de Pago</th>
                </tr>
            </thead>
            <tbody>
                {% for p in pagos %}
                <tr>
                    <td>{{ p.id }}</td>
                    <td>{{ p.cobro.habitante.nombre }}</td>
                    <td>{{ p.cobro.periodo.nombre }}</td>
                    <td>${{ p.monto_pagado }}</td>
                    <td>{{ p.fecha_pago }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
