<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comprobante de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 shadow-sm">
            <h2 class="text-success text-center">Comprobante de Pago</h2>
            <p><strong>Folio:</strong> {{ pago.folio }}</p>
            <p><strong>Habitante:</strong> {{ pago.cobro.habitante.nombre }}</p>
            <p><strong>Periodo:</strong> {{ pago.cobro.periodo.nombre }}</p>
            <p><strong>Monto Pagado:</strong> ${{ pago.monto_pagado }}</p>
            <p><strong>Fecha de Pago:</strong> {{ pago.fecha_pago }}</p>
        </div>
    </div>
</body>
</html>
