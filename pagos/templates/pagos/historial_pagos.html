<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Historial de Pagos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

    <h2>
        Historial de Pagos
    </h2>

    <table class="table table-striped">

        <thead>

            <tr>

                <th>Periodo</th>
                <th>Fecha</th>
                <th>Monto</th>

            </tr>

        </thead>

        <tbody>

        {% for pago in historial %}

        <tr>

            <td>
                {{ pago.cobro.periodo.nombre }}
            </td>

            <td>
                {{ pago.fecha_pago }}
            </td>

            <td>
                ${{ pago.monto_pagado }}
            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
