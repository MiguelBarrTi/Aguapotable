<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte de Pagos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2>
        Reporte de Pagos
    </h2>

    <button class="btn btn-secondary mb-3"
            onclick="window.print()">

        Imprimir Reporte

    </button>

    <table class="table table-striped">

        <thead>

            <tr>

                <th>Habitante</th>
                <th>Periodo</th>
                <th>Fecha</th>
                <th>Monto</th>

            </tr>

        </thead>

        <tbody>

        {% for pago in pagos %}

        <tr>

            <td>
                {{ pago.cobro.habitante.nombre }}
            </td>

            <td>
                {{ pago.cobro.periodo.nombre }}
            </td>

            <td>
                {{ pago.fecha_pago }}
            </td>

            <td>
                ${{ pago.monto_pagado }}
            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

    <div class="alert alert-success">

        <strong>Total Recaudado:</strong>

        ${{ total.monto_pagado__sum }}

    </div>

</div>

</body>
</html>
