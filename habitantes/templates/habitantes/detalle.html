<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Detalle Habitante</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            Información del Habitante

        </div>

        <div class="card-body">

            <p><strong>CURP:</strong> {{ habitante.curp }}</p>

            <p>
                <strong>Nombre Completo:</strong>

                {{ habitante.nombre }}
                {{ habitante.apellido_paterno }}
                {{ habitante.apellido_materno }}

            </p>

            <p><strong>Teléfono:</strong> {{ habitante.telefono }}</p>

            <p>

                <strong>Estado:</strong>

                {% if habitante.activo %}

                    Activo

                {% else %}

                    Inactivo

                {% endif %}

            </p>

            <a href="/habitantes/lista/"
               class="btn btn-primary">

                Regresar

            </a>

        </div>

    </div>

</div>

</body>
</html>
