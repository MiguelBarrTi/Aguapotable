<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dar de Baja Habitante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-danger">Dar de Baja Habitante</h2>
        <div class="card p-4 shadow-sm">
            <p><strong>ID:</strong> {{ habitante.id }}</p>
            <p><strong>Nombre:</strong> {{ habitante.nombre }}</p>
            <p><strong>Domicilio:</strong> {{ habitante.domicilio }}</p>
            <p><strong>Teléfono:</strong> {{ habitante.telefono }}</p>
            <p><strong>Estado actual:</strong> 
                {% if habitante.activo %}
                    <span class="badge bg-success">Activo</span>
                {% else %}
                    <span class="badge bg-danger">Inactivo</span>
                {% endif %}
            </p>
            <form method="POST" class="mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100">Confirmar Baja</button>
                <a href="{% url 'lista_habitantes' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
