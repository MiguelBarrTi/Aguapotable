<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Habitantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-primary">Habitantes Registrados</h2>
        <form method="GET" class="mb-3">
            <input type="text" name="q" class="form-control" placeholder="Buscar por nombre o ID">
        </form>
        <table class="table table-striped shadow-sm">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Domicilio</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for h in habitantes %}
                <tr>
                    <td>{{ h.id }}</td>
                    <td>{{ h.nombre }}</td>
                    <td>{{ h.domicilio }}</td>
                    <td>{{ h.telefono }}</td>
                    <td>
                        {% if h.activo %}
                            <span class="badge bg-success">Activo</span>
                        {% else %}
                            <span class="badge bg-danger">Inactivo</span>
                        {% endif %}
                    </td>
                    <td>
                        <a href="{% url 'detalle_habitante' h.id %}" class="btn btn-info btn-sm">Ver</a>
                        <a href="{% url 'modificar_habitante' h.id %}" class="btn btn-warning btn-sm">Editar</a>
                        <a href="{% url 'baja_habitante' h.id %}" class="btn btn-danger btn-sm">Dar de baja</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
