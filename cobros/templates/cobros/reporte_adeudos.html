<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte de Adeudos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2>
        Reporte de Adeudos
    </h2>

    <table class="table table-striped">

        <thead>

            <tr>

                <th>Habitante</th>
                <th>Periodo</th>
                <th>Monto</th>

            </tr>

        </thead>

        <tbody>

        {% for adeudo in adeudos %}

        <tr>

            <td>
                {{ adeudo.habitante.nombre }}
            </td>

            <td>
                {{ adeudo.periodo.nombre }}
            </td>

            <td>
                ${{ adeudo.monto }}
            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

    <div class="alert alert-danger">

        <strong>Total Adeudado:</strong>

        ${{ total.monto__sum }}

    </div>

</div>

</body>
</html>
