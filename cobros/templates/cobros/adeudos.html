<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultar Adeudos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-primary">
        Adeudos Pendientes
    </h2>

    <table class="table table-striped">

        <thead class="table-dark">
            <tr>
                <th>Habitante</th>
                <th>Periodo</th>
                <th>Monto</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody>

        {% for adeudo in adeudos %}

        <tr>

            <td>
                {{ adeudo.habitante.nombre }}
            </td>

            <td>
                {{ adeudo.periodo.nombre }}
            </td>

            <td>
                ${{ adeudo.monto }}
            </td>

            <td>

                <a href="{% url 'detalle_adeudo' adeudo.id %}"
                   class="btn btn-primary btn-sm">

                    Ver Detalle

                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
