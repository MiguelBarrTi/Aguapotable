<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Cuotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-primary">Cuotas Registradas</h2>
        <table class="table table-striped shadow-sm">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Monto</th>
                    <th>Periodo</th>
                    <th>Fecha límite</th>
                </tr>
            </thead>
            <tbody>
                {% for c in cuotas %}
                <tr>
                    <td>{{ c.id }}</td>
                    <td>${{ c.monto }}</td>
                    <td>{{ c.periodo }}</td>
                    <td>{{ c.fecha_limite }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
